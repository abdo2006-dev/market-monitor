name: Competitor Coverage Smoke

# Observational and manual only. This workflow performs gentle read-only HTTP
# acquisition against public storefronts. It never opens a database, dispatches
# Sync work, or writes Product/Event/Snapshot/Run state.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: competitor-coverage-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out selected branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Run read-only canonical coverage matrix
        run: python -m app.diagnostics.live_coverage --json competitor-coverage.json

      - name: Upload sanitized coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: competitor-coverage-${{ github.run_attempt }}
          path: backend/competitor-coverage.json
          if-no-files-found: error
          retention-days: 14
