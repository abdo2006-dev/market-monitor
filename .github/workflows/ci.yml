name: CI

# Phase 0 safety rail. This workflow runs only checks that are known to be reliable
# at this point in the project. It deliberately does NOT run:
#   - any test that touches a live competitor storefront (see docs/TESTING.md §5)
#   - Playwright browser automation (no browsers are installed here)
#   - eslint (declared in package.json but not installed; see docs/TESTING.md §3)
#
# Add checks here as they become trustworthy, not before.

on:
  push:
    branches: [main, "v2/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests, import, migrations)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
          POSTGRES_DB: market_monitor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U market -d market_monitor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      # Matches docker-compose.yml. No secrets: this database is created and
      # destroyed by the runner.
      DATABASE_URL: postgresql+asyncpg://market:market@localhost:5432/market_monitor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # pyproject.toml requires >=3.12; backend/Dockerfile uses python:3.12-slim.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Application import validation
        # Catches import-time breakage, circular imports, and router registration
        # errors that the unit tests do not exercise.
        run: |
          python -c "
          from app.main import app
          routes = [r for r in app.routes if getattr(r, 'methods', None)]
          assert routes, 'no routes registered'
          print(f'OK: {len(routes)} routes registered')
          "

      - name: Alembic upgrade head
        run: python -m alembic upgrade head

      - name: Alembic downgrade/upgrade round-trip
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Alembic model/migration drift (report only)
        # NON-BLOCKING BY DESIGN.
        # This currently reports drift: app/database.py runs Base.metadata.create_all
        # at startup alongside Alembic, and the two disagree on product_snapshots
        # index names. See docs/ARCHITECTURE.md A-1 and docs/adr/0002.
        # Promote this to a required check once ADR 0002 is implemented.
        continue-on-error: true
        run: |
          python -m alembic revision --autogenerate -m ci_drift_probe 2>&1 | tee drift.log
          rm -f alembic/versions/*ci_drift_probe*.py
          if grep -qiE "Detected (added|removed|type|nullable)" drift.log; then
            echo "::warning::Model/migration drift detected - expected until ADR 0002 lands"
          fi

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # This is the check that matters most here: `npm run build` uses Vite/esbuild,
        # which does NOT typecheck, so type errors were previously shippable.
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
