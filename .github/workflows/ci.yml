name: CI

# Phase 0 safety rail, extended in Phase 1A.
# This workflow runs only checks that are known to be reliable. It deliberately
# does NOT run:
#   - any test that touches a live competitor storefront (see docs/TESTING.md §5)
#   - Playwright browser automation (no browsers are installed here)
#   - eslint (declared in package.json but not installed)
#
# Add checks here as they become trustworthy, not before.

on:
  push:
    branches: [main, "v2/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests, import, migrations, schema authority)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
          POSTGRES_DB: market_monitor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U market -d market_monitor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      # Matches docker-compose.yml. No secrets: these databases are created and
      # destroyed by the runner.
      DATABASE_URL: postgresql+asyncpg://market:market@localhost:5432/market_monitor
      TEST_DATABASE_URL: postgresql+asyncpg://market:market@localhost:5432/market_monitor_test
      PGPASSWORD: market

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # pyproject.toml requires >=3.12; backend/Dockerfile uses python:3.12-slim.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create test database
        run: |
          psql -h localhost -U market -d postgres -c \
            "CREATE DATABASE market_monitor_test;"

      - name: Application import validation
        # Catches import-time breakage, circular imports, and router registration
        # errors that the unit tests do not exercise.
        run: |
          python -c "
          from app.main import app
          routes = [r for r in app.routes if getattr(r, 'methods', None)]
          assert routes, 'no routes registered'
          print(f'OK: {len(routes)} routes registered')
          "

      - name: Alembic upgrade head (fresh database)
        run: python -m alembic upgrade head

      - name: Alembic downgrade/upgrade round-trip
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Alembic model/migration drift
        # REQUIRED CHECK since Phase 1A.
        # Alembic is the single schema authority (docs/adr/0002). If the models
        # and the migrations disagree, autogenerate emits operations here and
        # this step fails. Migration 0003 converged the two historical index
        # naming schemes that previously made this permanently red.
        run: |
          set -o pipefail
          python -m alembic revision --autogenerate -m ci_drift_probe 2>&1 | tee drift.log
          probe=$(ls alembic/versions/*ci_drift_probe*.py)
          echo "--- generated migration ---"
          cat "$probe"
          if grep -qE "^\s+op\.[a-z_]+\(" "$probe"; then
            echo "::error::Model/migration drift detected. The models no longer match the migrations."
            echo "Add a migration for the change above, or revert the model edit."
            rm -f "$probe"
            exit 1
          fi
          rm -f "$probe"
          echo "No drift: models and migrations agree."

      - name: Unit tests
        run: python -m pytest tests/ -q -m "not critical"

      - name: Daily critical path tests (Search, Export, Sync, schema)
        # These require a database. TEST_DATABASE_URL is set above, so they run
        # for real here rather than skipping.
        run: python -m pytest tests/ -q -m critical

      - name: Assert critical tests were not silently skipped
        # The suite skips database-backed tests when TEST_DATABASE_URL is unset.
        # That is correct locally and unacceptable in CI, so fail if it happens.
        run: |
          set -o pipefail
          python -m pytest tests/ -q -m critical --no-header -rs 2>&1 | tee critical.log
          if grep -q "TEST_DATABASE_URL is not set" critical.log; then
            echo "::error::Critical database tests skipped in CI - TEST_DATABASE_URL not reaching pytest."
            exit 1
          fi

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # This is the check that matters most here: `npm run build` uses Vite/esbuild,
        # which does NOT typecheck, so type errors were previously shippable.
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
